<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Vista previa del widget</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(160deg, #eef2f7, #dfe6ef);
        color: #34465c;
      }
      main {
        max-width: 560px;
        padding: 48px 24px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vista previa del widget</h1>
      <p>
        Así se verá el chat en tu sitio web. Abre la burbuja de la esquina inferior derecha.
        Los mensajes que envíes aquí llegan a tu bandeja de entrada como una conversación real.
      </p>
    </main>
    <script>
      (function () {
        var key = new URLSearchParams(location.search).get('key');
        if (!key) return;
        var s = document.createElement('script');
        s.src = '/widget.js';
        s.setAttribute('data-widget-key', key);
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
