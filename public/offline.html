<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F7FB">
  <title>Sin conexión</title>
  <style>
    :root { color-scheme: light dark; --bg: #F5F7FB; --card: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #2563EB; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --card: #111827; --fg: #f3f4f6; --muted: #9ca3af; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 380px; padding: 32px 24px; text-align: center;
      background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgb(0 0 0 / .08);
    }
    img { width: 56px; height: 56px; object-fit: contain; }
    h1 { margin: 16px 0 8px; font-size: 1.25rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    button {
      width: 100%; min-height: 44px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo-mark.png" alt="">
    <h1>Sin conexión</h1>
    <p>No hay conexión a internet. Revisa tu red y vuelve a intentarlo; tus conversaciones siguen guardadas.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
